name: Bug report
description: Something in this repository fails or behaves wrongly.
body:
  - type: markdown
    attributes:
      value: |
        This repository covers the GetThermal desktop viewer. GroupGets provides this code as is and does not offer support, but clear reports help everyone who uses it.

        Before filing, please check the [README](https://github.com/groupgets/GetThermal#readme) and search existing issues, open and closed.

        Problems flashing or updating the board's firmware belong in the [firmware repository](https://github.com/groupgets/purethermal1-firmware/issues).
  - type: dropdown
    id: board
    attributes:
      label: "Board"
      options:
        - "PureThermal 3"
        - "PureThermal 2"
        - "PureThermal 1"
        - "PureThermal Mini"
        - "PureThermal Mini Pro"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: lepton
    attributes:
      label: "Lepton model"
      description: "Printed on the label on the back of the Lepton module."
      options:
        - "Lepton 3.5"
        - "Lepton 3.1R"
        - "Lepton 3.0"
        - "Lepton 2.5"
        - "Lepton 2.0"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: "Host computer"
      options:
        - "Windows"
        - "macOS"
        - "Linux (x86-64)"
        - "Raspberry Pi OS"
        - "Other"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: "Operating system and version"
      description: "For example `Windows 11 24H2`, `macOS 15.1 on Apple Silicon`, `Ubuntu 24.04`, or `Raspberry Pi OS bookworm on a Pi 5`."
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: "PureThermal firmware version"
      description: "The board reports it in its USB device name, for example `PureThermal (fw:v1.3.1)`. Linux: `lsusb -v -d 1e4e:0100 | grep iProduct`. macOS: `system_profiler SPUSBDataType | grep PureThermal`. Windows: Device Manager > Cameras. Please update to the latest release first: https://github.com/groupgets/purethermal1-firmware/releases"
      placeholder: "v1.3.1"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: "How did you install GetThermal?"
      options:
        - "Prebuilt release download"
        - "Built from source"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "What you did, what you expected, and what happened instead."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "The exact commands or actions, in order, starting from a fresh setup if you can."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: "Full output or error"
      description: "Paste the complete terminal output or error message. It is formatted as code automatically."
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues, open and closed, for this problem.
          required: true
        - label: My board is on the latest PureThermal firmware.
          required: false
